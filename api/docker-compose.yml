# capitalwise back-end — development stack.
#
# Part of the `capitalwise` compose project. Start order does not matter — see the
# naming rules in .claude/skills/create-container/SKILL.md. The API reaches
# PostgreSQL and Redis from the root docker-compose.yml, so start that too.
#
#   docker compose up -d                # start the API
#   docker compose logs -f back-end     # follow the logs
#   docker compose down                 # stop it

name: capitalwise

services:
  back-end:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: capitalwise/back-end:dev
    restart: unless-stopped
    # The whole repo is mounted, so work happens in the back-end subdirectory.
    working_dir: /workspaces/back-end
    # node_modules lives in a named volume, so it is empty on a fresh start.
    command: sh -c "bun install && exec bun run dev"
    # The root .env carries the infrastructure credentials (DB_*, CACHE_*), so
    # they are defined once; back-end/.env carries the API's own settings.
    # Missing files are fine — the app falls back to its defaults.
    env_file:
      - path: ../.env
        required: false
      - path: ./.env
        required: false
    environment:
      NODE_ENV: development
      # The container port is fixed; API_PORT moves the host side only.
      PORT: "3001"
      # In-network addresses — these win over the host ports in ../.env.
      DB_HOST: db
      DB_PORT: "5432"
      CACHE_HOST: cache
      CACHE_PORT: "6379"
      # tsc's watcher misses bind-mount events on macOS/Windows; poll instead.
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    ports:
      - "${API_PORT:-3001}:3001"
      - "${API_DEBUG_PORT:-9229}:9229"
    volumes:
      # The repo root, so `.git` is reachable from inside the container.
      - ..:/workspaces:cached
      # Keep the Linux-built dependencies out of the host bind mount.
      - back-end-node-modules:/workspaces/back-end/node_modules
    networks:
      - capitalwise

volumes:
  back-end-node-modules:

networks:
  capitalwise:
    # Shared by every compose file in the repo. A fixed name, not `external`:
    # whichever stack starts first creates it, the rest join, the last `down`
    # removes it.
    name: capitalwise
    driver: bridge
