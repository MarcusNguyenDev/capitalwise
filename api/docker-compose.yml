# capitalwise api — development stack.
#
# Part of the `capitalwise` compose project. Start order does not matter — see the
# naming rules in .claude/skills/create-container/SKILL.md. The API reaches
# PostgreSQL and Redis from the root docker-compose.yml, so start that too.
#
#   docker compose up -d                # start the API
#   docker compose logs -f api         # follow the logs
#   docker compose down                 # stop it

name: capitalwise

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: capitalwise/api:dev
    restart: unless-stopped
    # The whole repo is mounted, so work happens in the api subdirectory.
    working_dir: /workspaces/api
    # node_modules lives in a named volume, so it is empty on a fresh start.
    command: sh -c "bun install && exec bun run dev"
    # api/.env is the only config this service reads: its own settings and
    # secrets (database and cache credentials included). Missing is fine, the
    # app then uses the defaults from api/.env.example.
    env_file:
      - path: ./.env
        required: false
    environment:
      NODE_ENV: development
      # The container port is fixed; API_PORT moves the host side only.
      PORT: "3002"
      # In-network addresses: these win over the host ports in api/.env.
      DB_HOST: db
      DB_PORT: "5432"
      CACHE_HOST: cache
      CACHE_PORT: "6379"
      # tsc's watcher misses bind-mount events on macOS/Windows; poll instead.
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    ports:
      - "${API_PORT:-3002}:3002"
      - "${API_DEBUG_PORT:-9230}:9229"
    volumes:
      # The repo root, so `.git` is reachable from inside the container.
      - ..:/workspaces:cached
      # Keep the Linux-built dependencies out of the host bind mount.
      - api-node-modules:/workspaces/api/node_modules
    networks:
      - capitalwise

volumes:
  api-node-modules:

networks:
  capitalwise:
    # Shared by every compose file in the repo. A fixed name, not `external`:
    # whichever stack starts first creates it, the rest join, the last `down`
    # removes it.
    name: capitalwise
    driver: bridge
