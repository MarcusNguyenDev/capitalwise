# capitalwise core — development stack.
#
# Part of the `capitalwise` compose project. Start order does not matter — see the
# naming rules in .claude/skills/create-container/SKILL.md. The API reaches
# PostgreSQL and Redis from the root docker-compose.yml, so start that too.
#
#   docker compose up -d                # start core
#   docker compose logs -f core         # follow the logs
#   docker compose down                 # stop it

name: capitalwise

services:
  core:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: capitalwise/core:dev
    restart: unless-stopped
    # The whole repo is mounted, so work happens in the core subdirectory.
    working_dir: /workspaces/core
    # node_modules lives in a named volume, so it is empty on a fresh start.
    command: sh -c "bun install && exec bun run dev"
    # core/.env is the only config this service reads: its own settings and
    # secrets (database, cache and LiveKit credentials included). Missing is
    # fine, the app then uses the defaults from core/.env.example.
    env_file:
      - path: ./.env
        required: false
    environment:
      NODE_ENV: development
      # The container port is fixed; CORE_PORT in .env moves the host side only,
      # so it is pinned here for the process inside the container.
      PORT: "3001"
      CORE_PORT: "3001"
      # In-network addresses: these win over the host ones in core/.env.
      API_INTERNAL_URL: http://api:3002
      DB_HOST: db
      DB_PORT: "5432"
      CACHE_HOST: cache
      CACHE_PORT: "6379"
      LIVEKIT_URL: ws://media:7880
      SPEACHES_BASE_URL: http://speech:8000/v1
      # tsc's watcher misses bind-mount events on macOS/Windows; poll instead.
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    # A self-hosted Ollama on the host is reachable as
    # http://host.docker.internal:11434 (set OLLAMA_BASE_URL to that).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${CORE_PORT:-3001}:3001"
      - "${CORE_DEBUG_PORT:-9229}:9229"
    volumes:
      # The repo root, so `.git` is reachable from inside the container.
      - ..:/workspaces:cached
      # Keep the Linux-built dependencies out of the host bind mount.
      - core-node-modules:/workspaces/core/node_modules
    networks:
      - capitalwise

volumes:
  core-node-modules:

networks:
  capitalwise:
    # Shared by every compose file in the repo. A fixed name, not `external`:
    # whichever stack starts first creates it, the rest join, the last `down`
    # removes it.
    name: capitalwise
    driver: bridge
